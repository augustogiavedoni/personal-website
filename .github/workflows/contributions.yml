# Refreshes the contribution heatmap once a day. The commit it makes triggers a normal
# Cloudflare build, so the live site updates without anything else.
name: Update contributions

on:
  schedule:
    - cron: '17 9 * * *' # 06:17 in Buenos Aires
  workflow_dispatch: # run it by hand from the Actions tab

# Only scheduled and manual runs: pull requests from forks can never reach the token.
permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Fetch contributions
        run: node scripts/fetch-contributions.mjs
        env:
          # Uses a CONTRIBUTIONS_TOKEN secret if you add one, otherwise the workflow's own token.
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}

      - name: Commit if changed
        run: |
          git add src/data/contributions.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contributions data"
          git push
